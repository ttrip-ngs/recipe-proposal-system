[project]
name = "recipe-system"
version = "0.1.0"
description = "家庭内レシピ提案システム (Phase 1 MVP)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "anthropic[vertex]>=0.39.0",
    "google-cloud-firestore>=2.19.0",
    "firebase-admin>=6.5.0",
    "structlog>=24.4.0",
    "pyyaml>=6.0.2",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "google-genai>=2.10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-docker>=3.1.1",
    "types-pyyaml>=6.0.12",
    "openpyxl>=3.1.5",
    "types-openpyxl>=3.1.5.20260827",
    "typesafe-sdk>=0.7.2,<0.8",  # 0.x で破壊的変更が続いているため minor を固定
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_system"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "evaluation"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
]
ignore = [
    "PLR0913",  # too-many-arguments
    "B008",     # FastAPI Depends() は default 引数で使うのが慣例
    "PLC0415",  # 遅延 import (循環回避・重い依存の遅延ロード) は意図的に使用
]

[tool.ruff.lint.per-file-ignores]
# tests の日本語関数名 (N802, PLC2401) は意図的に許容する.
# PLR2004/S101 は pytest の慣例として許容.
"tests/**/*.py" = ["N802", "PLC2401", "PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "google.cloud.firestore.*",
    "firebase_admin.*",
    "anthropic.*",
]
ignore_missing_imports = true

# google-cloud-firestore の同期 Client は型スタブが sync/async の Union になっており、
# sync コードで DocumentSnapshot | Awaitable[DocumentSnapshot] 系の誤判定が出る.
# これは SDK 起因のため repository 層に限り当該エラーを抑制する (CLAUDE.md §外部ライブラリ起因の例外).
[[tool.mypy.overrides]]
module = "recipe_system.repository.*"
disable_error_code = ["union-attr", "no-any-return", "assignment"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: Firebase エミュレータ等を使った統合テスト",
    "guardrails: ガードレール関連テスト (高カバレッジ必須)",
]

[tool.coverage.run]
source = ["src/recipe_system"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
