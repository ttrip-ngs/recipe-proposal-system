# 食材エイリアス辞書
# canonical 名と表記揺れ (aliases) の対応.
#
# source ラベル:
#   consumer-agency-2026: 消費者庁 特定原材料等 29 品目 (2026-04-01 改正反映)
#   household-custom    : 家庭独自の追加 (エイリアス拡張, 嫌い食材判定など)
#   household-safety    : 公式リストから外れたがアレルギー保有者保護のため維持
#
# 改正履歴:
#   - 2023-03-09 義務にくるみ追加
#   - 2024-03-28 推奨にマカダミアナッツ追加, まつたけ削除
#   - 2026-04-01 義務にカシューナッツ昇格, 推奨にピスタチオ追加
#   - 2026-09-26 手順の文章検査用に text_match_exclude を追加 (version 3)
#   - 2026-09-27 大豆 の別表記から 味噌 / みそ を削除 (version 4). canonical 味噌 と
#                二重登録され大豆タグが外れていた. 大豆との対応は allergens.yaml で持つ
version: "4"
last_reviewed_at: "2026-09-27"
# 部分一致のアレルゲン検査 (手順・辞書に無い食材名・食材名の括弧書き) で使わない語.
# 食材リストの照合 (照合キーの完全一致) には影響しない. 短い語が無関係な語の一部として現れ
# 誤検出になるものだけを載せる. 追加・削除は人間がレビューすること (6.6 と同様).
# 実測 (Opus 5.5 の手順 279 件, memo/history/026) で誤検出した語と、同種の語:
text_match_exclude:
  - パン    # 「フライパン」(小麦)
  - とり    # 「冷水にとり」(鶏肉)
  - 牛      # 「牛乳」(牛肉)
  - もも    # 「鶏もも肉」(果物のもも)
  - モモ    # 同上
  - 乳      # 「豆乳」「乳化」(乳)
  - いか    # 「〜いかが」「しいたけ」系 (いか)
  - かに    # 「なめらかに」「やわらかに」(カニ)
  - さけ    # 「避ける」(さけ)
entries:
