# 食材名 -> 小売物価統計の銘柄符号 の対応表 (手動管理).
#
# 各エントリ:
#   code   : retail_prices.yaml の銘柄符号
#   names  : この価格を使う食材名 (LLM 出力の name / canonical と照合. 括弧書きは除去して照合)
#            照合は text_normalize.fold_key で行い, カタカナ/ひらがな・全角/半角・空白の違いは
#            吸収されるため, 「マグロ」「まぐろ」のような表記違いを並べて書かない (重複エラーになる)
#   pieces : 個数系の単位 -> 基本単位 (g / ml / 個 / 枚) への換算量. 標準的な 1 単位の目安
#   per    : 統計の単位表記から規格量を読み取れない場合のみ明示する
#
# 方針:
# - 統計に無い食材を別品目の価格で推測しない (ひき肉など同じ畜種の部位違いのみ代用を許す)
# - 対応しない食材は「価格不明」として合計から除外し, 画面に件数を出す
# - pantry は少量を長期間使う常備品. 1 食あたりの按分は誤差が大きいため概算の対象外とする
