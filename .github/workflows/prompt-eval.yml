# ゴールデンセット評価を実 LLM (Anthropic API 直接) で実行する. 手動起動のみ.
#
# 評価は API 料金がかかり、CLAUDE.md 6.3 でプロンプト変更時のローカル実行を必須にしているため
# PR ごとの自動実行はしない. CI 上で確認したいときだけ Actions 画面から起動する.
# フェイク LLM は固定の献立しか返さず評価にならないため使わない.
# 実行にはリポジトリ Secret ANTHROPIC_API_KEY が必要.
name: Prompt eval

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden:
    name: golden set (live)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # 評価では Vertex / Firestore / セッションを使わないが、設定の必須項目のため埋める
      GOOGLE_CLOUD_PROJECT: ci
      ANTHROPIC_VERTEX_PROJECT_ID: ci
      SESSION_SECRET: ci
    steps:
      - name: Secret の確認
        if: env.ANTHROPIC_API_KEY == ''
        run: |
          echo "::error::Secret ANTHROPIC_API_KEY が未登録のため評価を実行できない (gh secret set ANTHROPIC_API_KEY)"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: 評価実行
        run: |
          uv sync --frozen
          uv run python evaluation/runner.py --live \
            --golden evaluation/golden/*.jsonl \
            --prompt-version "${GITHUB_SHA}" \
            --output evaluation/reports/ci.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: prompt-eval-report
          path: evaluation/reports/ci.json
          if-no-files-found: ignore
